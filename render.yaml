services:
  - type: web
    name: whatsapp-reader-mcp
    runtime: node
    plan: starter            # free works too, but it sleeps after 15 idle minutes
    region: virginia
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    numInstances: 1          # WhatsApp allows one live session per linked device
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: TIMEZONE
        value: America/Tegucigalpa
      - key: AUTH_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false          # paste your Supabase Session pooler connection string
